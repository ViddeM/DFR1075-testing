[package]
name = "niceview-device"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
esp-backtrace = { version = "0.18.1", features = [
    "esp32c6",
    "panic-handler",
    "println",
] }
esp-hal = { version = "1.0.0", features = ["esp32c6", "unstable"] }
esp-println = { version = "0.16.1", features = ["esp32c6", "log-04"] }
log = { version = "0.4.29" }
esp-alloc = { version = "0.9.0" }
embedded-io = "0.7.1"
heapless = { version = "0.9.2", default-features = false }
embassy-executor = { version = "0.9.1" }
embassy-time = { version = "0.5.0" }
esp-rtos = { version = "0.2.0", features = ["embassy", "esp32c6", "log-04", "esp-alloc"]}
static_cell = "2.1.1"
rand_core = "0.9.5"
embedded-hal-async = "1.0.0"
embedded-hal = "1.0.0"
display-interface = "0.5.0"
niceview-lib = { workspace = true }
esp-sync = { version = "0.1.1", features = ["esp32c6", "log-04"] }
