[package]
name = "niceview-device"
edition = "2021"
license = "MIT OR Apache-2.0"

#[patch.crates-io]
#esp-wifi-sys.path = "../../esp-wifi-sys/esp-wifi-sys"
#esp-wifi-sys

[dependencies]
#bleps = { git = "https://github.com/bjoernQ/bleps", package = "bleps", rev = "793f248c8bdd9b114a8f84868052939d12ed7da4", features = [ "macros", "async", "crypto"] }
#bleps = { path = "../../bleps/bleps", features = ["macros", "async", "crypto"] }
esp-backtrace = { version = "0.14.2", features = [
    "esp32c6",
    "exception-handler",
    "panic-handler",
    "println",
] }
esp-hal = { version = "0.22.0", features = ["esp32c6"] }
esp-println = { version = "0.12.0", features = ["esp32c6", "log"] }
log = { version = "0.4.22" }
esp-alloc = { version = "0.5.0" }
embedded-io = "0.6.1"
#esp-wifi = { version = "0.11.0", features = ["esp32c6", "ble", "log"] }
heapless = { version = "0.8.0", default-features = false }
embassy-executor = { version = "0.6.3", features = [
    "task-arena-size-40960",
    "integrated-timers",
] }
embassy-time = { version = "0.3.2" }
esp-hal-embassy = { version = "0.5.0", features = ["esp32c6", "log"] }
static_cell = "2.1.0"
rand_core = "0.6.4"
embedded-hal-async = "1.0.0"
embedded-hal = "1.0.0"
fugit = { version = "0.3.7", features = ["defmt"] }
display-interface = "0.5.0"
niceview-lib = { workspace = true }
